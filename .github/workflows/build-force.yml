name: Build AdBlocker-Force APK
on:
  push:
    paths:
      - 'AdBlocker-Force/app/**'
      - 'AdBlocker-Force/build.gradle'
      - 'AdBlocker-Force/settings.gradle'
      - 'AdBlocker-Force/gradle.properties'
      - 'AdBlocker-Force/gradle/**'
      - '.github/workflows/build-force.yml'
  pull_request:
    paths:
      - 'AdBlocker-Force/**'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AdBlocker-Force
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AdBlocker-Force-debug-apk
          path: AdBlocker-Force/app/build/outputs/apk/debug/*.apk
